name: Build and test
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit. Pushes to main have no pull request number,
# so each gets its own group and runs to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  JVM-Run-Gradle-Check:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version-file: '.java-version'

      # Also validates the Gradle wrapper.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run checks
        run: |
          ./gradlew check --continue

      - name: Run Build Health
        run: |
          ./gradlew buildHealth --continue
          # if 'build-health-report.txt' is not empty, fail and echo the content
          if [ -s build/reports/dependency-analysis/build-health-report.txt ]; then
              echo "Build health report:"
              cat build/reports/dependency-analysis/build-health-report.txt
              exit 1
          fi
